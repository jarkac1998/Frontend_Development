<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>James Doe Younge A.G.M High School — School Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#1808AC;
  --navy-dark:#120876;
  --navy-darker:#0b0550;
  --gold:#FFC300;
  --gold-dark:#E0A800;
  --ink:#151833;
  --ink-soft:#5B5F7A;
  --line:#E7E8F2;
  --bg:#F5F6FB;
  --card:#FFFFFF;
  --green:#1D9A6C;
  --green-bg:#E7F8F1;
  --red:#D8365B;
  --red-bg:#FCE8ED;
  --amber:#C98600;
  --amber-bg:#FFF3DA;
  --blue-bg:#E9EBFB;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(21,24,51,.04), 0 6px 20px -8px rgba(21,24,51,.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-display{font-family:'Sora',system-ui,sans-serif;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
a{text-decoration:none;color:inherit;}
::selection{background:var(--gold);color:var(--navy-darker);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#C7CAE0;border-radius:8px;}

/* ---------- App Shell ---------- */
#app{min-height:100vh;}
.hidden{display:none !important;}

/* ================= LOGIN PAGE ================= */
.login-wrap{
  min-height:100vh;
  display:grid;
  grid-template-columns:1.05fr 1fr;
}
@media (max-width:900px){
  .login-wrap{grid-template-columns:1fr;}
  .login-visual{display:none;}
}
.login-visual{
  position:relative;
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy-dark) 55%,var(--navy-darker) 100%);
  overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:48px 56px;
  color:#fff;
}
.login-visual::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle at 15% 15%, rgba(255,195,0,.14), transparent 40%),
                    radial-gradient(circle at 85% 90%, rgba(255,195,0,.10), transparent 45%);
}
.login-visual .brand-row{display:flex;align-items:center;gap:14px;position:relative;z-index:2;}
.login-visual .brand-row img{width:52px;height:52px;object-fit:contain;}
.login-visual .brand-row .school-name{font-family:'Sora';font-weight:700;font-size:15px;line-height:1.25;}
.login-visual .brand-row .school-name span{display:block;font-weight:400;font-size:12px;opacity:.75;}
.login-quote{position:relative;z-index:2;max-width:460px;}
.login-quote .motto{font-family:'Sora';font-weight:800;font-size:clamp(28px,3.4vw,40px);line-height:1.15;letter-spacing:-.01em;}
.login-quote .motto em{font-style:normal;color:var(--gold);}
.login-quote p{color:rgba(255,255,255,.7);font-size:15px;line-height:1.6;margin-top:16px;}
.login-photo{
  position:relative;z-index:2;
  border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,255,255,.18);
  width:220px;
  box-shadow:0 20px 40px -12px rgba(0,0,0,.5);
}
.login-photo img{aspect-ratio:1/1;object-fit:cover;}
.login-photo .cap{
  background:rgba(11,5,80,.7);backdrop-filter:blur(6px);
  padding:9px 12px;font-size:11.5px;color:#fff;
}
.login-photo .cap b{display:block;font-size:12.5px;}
.login-stats{position:relative;z-index:2;display:flex;gap:28px;margin-top:36px;}
.login-stats div b{display:block;font-family:'Sora';font-size:22px;font-weight:700;}
.login-stats div span{font-size:11.5px;color:rgba(255,255,255,.65);}

.login-form-side{
  display:flex;align-items:center;justify-content:center;
  padding:32px 24px;
}
.login-card{width:100%;max-width:380px;}
.login-card .mobile-brand{display:none;align-items:center;gap:10px;margin-bottom:28px;}
.login-card .mobile-brand img{width:40px;height:40px;object-fit:contain;}
@media (max-width:900px){.login-card .mobile-brand{display:flex;}}
.login-card h1{font-size:24px;font-weight:700;margin:0 0 6px;}
.login-card .sub{color:var(--ink-soft);font-size:14px;margin:0 0 28px;}
.role-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
.role-pill{
  border:1px solid var(--line);background:#fff;border-radius:100px;
  padding:6px 13px;font-size:12.5px;font-weight:500;color:var(--ink-soft);
  transition:.15s;
}
.role-pill.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.field input{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
  font-size:14px;font-family:inherit;background:#fbfbfe;transition:.15s;
}
.field input:focus{outline:none;border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(24,8,172,.08);}
.login-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;font-size:13px;}
.login-row label{display:flex;align-items:center;gap:7px;color:var(--ink-soft);cursor:pointer;}
.login-row a{color:var(--navy);font-weight:600;}
.btn-primary{
  width:100%;background:var(--navy);color:#fff;border:none;border-radius:10px;
  padding:13px;font-size:14.5px;font-weight:700;letter-spacing:.2px;transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary:hover{background:var(--navy-dark);}
.login-foot{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:22px;}

/* ================= DASHBOARD SHELL ================= */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex-shrink:0;background:var(--navy-darker);
  background:linear-gradient(180deg,var(--navy-darker), #0a0448 70%);
  color:#fff;display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:50;
  transition:transform .25s ease;
}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-brand img{width:38px;height:38px;object-fit:contain;flex-shrink:0;}
.sidebar-brand .txt{font-family:'Sora';font-weight:700;font-size:13px;line-height:1.25;}
.sidebar-brand .txt span{display:block;font-weight:400;font-size:10.5px;color:rgba(255,255,255,.55);}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.35);font-weight:600;margin:16px 10px 6px;}
.nav-section:first-child{margin-top:4px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:9px;
  color:rgba(255,255,255,.72);font-size:13.5px;font-weight:500;margin-bottom:2px;
  transition:.12s;position:relative;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(255,195,0,.14);color:var(--gold);}
.nav-item.active svg{color:var(--gold);}
.nav-badge{margin-left:auto;background:var(--gold);color:var(--navy-darker);font-size:10px;font-weight:800;padding:1px 7px;border-radius:100px;}
.sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);}
.sidebar-user{display:flex;align-items:center;gap:10px;}
.sidebar-user .avatar{width:34px;height:34px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--gold);}
.sidebar-user .name{font-size:12.5px;font-weight:600;}
.sidebar-user .role{font-size:11px;color:rgba(255,255,255,.5);}
.logout-btn{margin-left:auto;color:rgba(255,255,255,.5);}
.logout-btn:hover{color:var(--gold);}

.main{margin-left:250px;flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  height:64px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:30;
}
.menu-toggle{display:none;background:none;border:none;color:var(--ink);}
.page-title{font-family:'Sora';font-weight:700;font-size:18px;}
.page-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.topbar-search{
  flex:1;max-width:360px;display:flex;align-items:center;gap:9px;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 13px;margin-left:8px;
}
.topbar-search input{border:none;background:none;outline:none;font-size:13px;width:100%;font-family:inherit;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
.icon-btn{position:relative;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.icon-btn:hover{background:var(--bg);}
.icon-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff;}
.topbar-user{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--line);}
.topbar-user img{width:34px;height:34px;border-radius:9px;object-fit:cover;}
.topbar-user .tu-name{font-size:12.5px;font-weight:600;}
.topbar-user .tu-role{font-size:11px;color:var(--ink-soft);}

.content{padding:24px;flex:1;max-width:1400px;width:100%;margin:0 auto;}

@media (max-width:960px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 0 2000px rgba(0,0,0,.4);}
  .main{margin-left:0;}
  .menu-toggle{display:flex;}
  .topbar-search{display:none;}
  .content{padding:16px;}
}

/* ================= COMPONENTS ================= */
.grid{display:grid;gap:16px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.g-4,.g-3,.g-2{grid-template-columns:1fr;}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:20px;}
.card-head{display:flex;align-items:center;justify-content:between;padding:18px 20px;border-bottom:1px solid var(--line);}
.card-head h3{font-size:14.5px;font-weight:700;margin:0;}
.card-head .muted{font-size:12px;color:var(--ink-soft);margin-top:2px;}

.stat-card{padding:19px 20px;display:flex;flex-direction:column;gap:10px;}
.stat-top{display:flex;align-items:center;justify-content:space-between;}
.stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.stat-icon svg{width:19px;height:19px;}
.stat-trend{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:100px;}
.trend-up{background:var(--green-bg);color:var(--green);}
.trend-down{background:var(--red-bg);color:var(--red);}
.stat-num{font-family:'Sora';font-size:26px;font-weight:700;line-height:1;}
.stat-label{font-size:12.5px;color:var(--ink-soft);font-weight:500;}

.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:9px;font-size:13px;font-weight:600;
  padding:9px 15px;border:1.5px solid transparent;transition:.12s;white-space:nowrap;
}
.btn svg{width:15px;height:15px;}
.btn-nav{background:var(--navy);color:#fff;}
.btn-nav:hover{background:var(--navy-dark);}
.btn-gold{background:var(--gold);color:var(--navy-darker);}
.btn-gold:hover{background:var(--gold-dark);}
.btn-line{background:#fff;border-color:var(--line);color:var(--ink);}
.btn-line:hover{background:var(--bg);}
.btn-ghost{background:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--bg);color:var(--ink);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-danger{background:var(--red-bg);color:var(--red);}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:100px;}
.b-green{background:var(--green-bg);color:var(--green);}
.b-red{background:var(--red-bg);color:var(--red);}
.b-amber{background:var(--amber-bg);color:var(--amber);}
.b-blue{background:var(--blue-bg);color:var(--navy);}
.b-gray{background:#EFF0F5;color:var(--ink-soft);}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);
  font-weight:700;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:12px 16px;border-bottom:1px solid #F0F1F7;vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFAFD;}
.cell-user{display:flex;align-items:center;gap:10px;}
.cell-user img{width:32px;height:32px;border-radius:8px;object-fit:cover;}
.cell-user .cu-name{font-weight:600;font-size:13px;}
.cell-user .cu-sub{font-size:11.5px;color:var(--ink-soft);}
.avatar-fallback{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0;}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-width:220px;flex:1;max-width:320px;}
.search-box input{border:none;outline:none;font-size:13px;width:100%;font-family:inherit;}
.select-box select{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
.tab{padding:10px 4px;margin-right:22px;font-size:13.5px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--navy);border-color:var(--navy);}

.progress{height:7px;border-radius:100px;background:#EDEEF6;overflow:hidden;}
.progress > div{height:100%;border-radius:100px;background:var(--navy);}

.modal-overlay{position:fixed;inset:0;background:rgba(11,5,80,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 60px -15px rgba(0,0,0,.35);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;}
.modal-head h3{margin:0;font-size:16px;font-weight:700;}
.modal-body{padding:22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:520px){.form-grid{grid-template-columns:1fr;}}
.form-grid .full{grid-column:1/-1;}
.fg label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--ink);}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:#fbfbfe;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--navy);background:#fff;}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--navy-darker);color:#fff;padding:13px 18px;border-radius:11px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);min-width:240px;animation:slidein .2s ease;}
.toast svg{width:16px;height:16px;color:var(--gold);flex-shrink:0;}
@keyframes slidein{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
.empty-state svg{width:42px;height:42px;margin:0 auto 12px;opacity:.5;}
.empty-state b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px;}

.grad-hero{
  background:linear-gradient(120deg,var(--navy) 0%, var(--navy-dark) 60%, var(--navy-darker) 100%);
  border-radius:18px;padding:28px 30px;color:#fff;position:relative;overflow:hidden;
}
.grad-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 90% 10%, rgba(255,195,0,.16), transparent 45%);}
.grad-hero *{position:relative;z-index:2;}

.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media (max-width:900px){.gallery-grid{grid-template-columns:repeat(2,1fr);}}
.gallery-tile{border-radius:14px;overflow:hidden;position:relative;aspect-ratio:4/3;border:1px solid var(--line);}
.gallery-tile img,.gallery-tile .ph{width:100%;height:100%;object-fit:cover;}
.gallery-tile .ph{display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Sora';font-weight:700;font-size:13px;text-align:center;padding:10px;}
.gallery-cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(0deg,rgba(11,5,80,.82),transparent);color:#fff;font-size:12px;font-weight:600;}

.id-card{
  width:320px;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);
  box-shadow:0 20px 40px -18px rgba(21,24,51,.3);
}
.id-card-head{background:linear-gradient(120deg,var(--navy),var(--navy-darker));padding:16px 18px;display:flex;align-items:center;gap:10px;color:#fff;}
.id-card-head img{width:30px;height:30px;object-fit:contain;}
.id-card-head .t1{font-family:'Sora';font-weight:700;font-size:11.5px;line-height:1.2;}
.id-card-head .t1 span{display:block;font-weight:400;font-size:9.5px;opacity:.7;}
.id-card-body{padding:18px;display:flex;gap:14px;}
.id-card-body img.ph{width:76px;height:90px;border-radius:8px;object-fit:cover;border:2px solid var(--line);}
.id-card-strip{height:8px;background:var(--gold);}

.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line);}
.kv span:first-child{color:var(--ink-soft);}
.kv span:last-child{font-weight:600;}

.event-card{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
.event-card:last-child{border:none;}
.event-date{width:52px;height:52px;border-radius:11px;background:var(--blue-bg);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.event-date b{font-family:'Sora';font-size:17px;font-weight:800;line-height:1;}
.event-date span{font-size:9.5px;font-weight:700;text-transform:uppercase;}

.ann-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.ann-item:last-child{border:none;}
.ann-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}

.role-switcher{position:fixed;bottom:18px;left:18px;z-index:150;}
@media (max-width:960px){.role-switcher{display:none;}}
.role-switch-btn{background:var(--navy-darker);color:#fff;border-radius:100px;padding:9px 16px 9px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 10px 25px -8px rgba(0,0,0,.4);}
.role-switch-menu{position:absolute;bottom:46px;left:0;background:#fff;border-radius:12px;box-shadow:0 20px 40px -12px rgba(0,0,0,.25);border:1px solid var(--line);width:200px;overflow:hidden;}
.role-switch-menu button{width:100%;text-align:left;padding:10px 14px;font-size:12.5px;font-weight:500;background:#fff;border:none;color:var(--ink);}
.role-switch-menu button:hover{background:var(--bg);}
.role-switch-menu button.on{color:var(--navy);font-weight:700;background:var(--blue-bg);}

.print-only{display:none;}
@media print{
  .sidebar,.topbar,.role-switcher,.no-print{display:none !important;}
  .main{margin-left:0 !important;}
  body{background:#fff;}
  .print-only{display:block;}
}
</style>
</head>
<body>
<div id="app"></div>

function computeStats(){
  const total=students.length;
  const male=students.filter(s=>s.gender==="Male").length;
  const female=total-male;
  const today = attendanceLog[todayStr()]||{};
  const present = Object.values(today).filter(v=>v==="Present").length;
  const attRate = total?Math.round((present/total)*100):0;
  const totalFees = payments.reduce((a,p)=>a+p.total,0);
  const collected = payments.reduce((a,p)=>a+p.paid,0);
  const outstanding = totalFees-collected;
  return {total,male,female,teachers:teachers.length,classes:CLASS_LIST.length*SECTIONS.length,attRate,collected,outstanding};
}

function savePayment(){
  const sid = document.getElementById("p_stu").value;
  const amt = Number(document.getElementById("p_amt").value)||0;
  const method = document.getElementById("p_method").value;
  const s = students.find(x=>x.id===sid);
  if(amt<=0){ toast("Please enter a valid amount."); return; }
  let rec = payments.find(p=>p.studentId===sid);
  const total = feeFor(s.cls);
  if(rec){ rec.paid=Math.min(total, rec.paid+amt); rec.balance=total-rec.paid; rec.date=todayStr(); rec.method=method; }
  else { payments.push({id:seedId("RCT",payments.length+1), studentId:sid, studentName:s.name, cls:s.cls+s.section, total, paid:amt, balance:total-amt, date:todayStr(), method}); }
  s.feesPaid = (rec?rec.paid:amt) >= total;
  closeModal();
  toast("Payment of "+fmtMoney(amt)+" recorded for "+s.name+".");
  renderFees();
}

  const title = document.getElementById("as_title").value.trim();
  if(!title){toast("Please enter an assignment title."); return;}
  assignments.unshift({id:assignments.length+1,title,subject:document.getElementById("as_subj").value,cls:document.getElementById("as_cls").value,due:document.getElementById("as_due").value||todayStr(),submissions:0,total:20,status:"Open"});

}

/* ---------------- MODAL SYSTEM ---------------- */
function openModal(title, bodyHtml, actions){
  let overlay = document.getElementById("modalOverlay");
  if(overlay) overlay.remove();
  overlay = document.createElement("div");
  overlay.className="modal-overlay"; overlay.id="modalOverlay";
  overlay.onclick=(e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>${title}</h3><button class="icon-btn" style="border:none" onclick="closeModal()">${I.x}</button></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-foot">${(actions||[]).map(a=>`<button class="btn ${a.cls}" onclick="${a.action}">${a.label}</button>`).join("")}</div>
    </div>`;
  document.body.appendChild(overlay);
}
function closeModal(){ const o=document.getElementById("modalOverlay"); if(o) o.remove(); }
window.openModal=openModal; window.closeModal=closeModal;

/* ---------------- ROUTER / MAIN RENDER ---------------- */
const RENDERERS = {
  dashboard: renderDashboard, students: renderStudents, teachers: renderTeachers,
  classes: renderClasses, attendance: renderAttendance, exams: renderExams,
  timetable: renderTimetable, assignments: renderAssignments, fees: renderFees,
  announcements: renderAnnouncements, events: renderEvents, gallery: renderGallery,
  profile: renderProfile, reports: renderReports, settings: renderSettings,
};

function render(){
  if(!State.loggedIn){ renderLogin(); return; }
  if(!roleAllows(State.route)) State.route="dashboard";
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="shell">
      ${sidebarHtml()}
      <div class="main">
        ${topbarHtml()}
        <div class="content" id="content"></div>
      </div>
    </div>
    ${roleSwitcherHtml()}
  `;
  (RENDERERS[State.route]||renderDashboard)();
  document.addEventListener("click", closeRoleMenuOnOutsideClick, {once:true});
}
function closeRoleMenuOnOutsideClick(e){
  const menu = document.getElementById("roleMenu");
  const btn = document.querySelector(".role-switch-btn");
  if(menu && !menu.classList.contains("hidden")){
    if(!menu.contains(e.target) && e.target!==btn && !btn.contains(e.target)){ menu.classList.add("hidden"); }
  }
  document.addEventListener("click", closeRoleMenuOnOutsideClick, {once:true});
}

/* ---------------- INIT ---------------- */
render();
